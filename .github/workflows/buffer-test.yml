name: mtgbuilder X Auto Post

on:
  # 手動でも実行できるように残しておく
  workflow_dispatch:

  # 日本時間 9:17 / 13:17 / 17:17 / 21:17 に自動投稿
  schedule:
    - cron: "55 17 * * *"
      timezone: "Asia/Tokyo"

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Post mtgbuilder to X via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request

          API = "https://api.buffer.com"
          TOKEN = os.environ["BUFFER_API_KEY"]

          DOWNLOAD_URL = "https://github.com/comu528/mtgbuilder-APK/releases/latest/download/mtgbuilder.apk"
          README_URL = "https://github.com/comu528/mtgbuilder-APK"

          # --------------------------------
          # 自動投稿する文章
          # ここは好きに増やしたり変更してOK
          # --------------------------------

          posts = [

              "MTGの統率者デッキを作成・管理できるAndroidアプリ「統率者ビルダー」を公開しました!\n\n"
              "完全無料で使用できます!\n"
              "#MTG #EDH\n\n"
              + DOWNLOAD_URL,

              "統率者デッキ管理用Androidアプリ「統率者ビルダー」を作りました!\n\n"
              "APKで公開しています。\n"
              "気になった方はぜひ使ってみてください。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #mtg",

              "MTG Commander / EDH向けのAndroidアプリ「統率者ビルダー」公開中です。\n\n"
              "オフラインでも閲覧ができます!\n\n"
              + DOWNLOAD_URL
              + "\n\n#EDH #mtg",

              "MTG統率者デッキ管理アプリ「統率者ビルダー」を公開しています。\n\n"
              "Android用APKはこちらからダウンロードできます。\n\n"
              + DOWNLOAD_URL,

              "統率者デッキをAndroidで管理するためのアプリを作りました。\n\n"
              "アプリ名：統率者ビルダー\n"
              "カード検索や欲しいものリスト追加もできます。\n\n"
              + DOWNLOAD_URL
              + "\n\n#統率者 #mtg",

              "MTGのデッキ管理、スマホでやりたい人向け。\n\n"
              "統率者用Androidアプリ「統率者ビルダー」を個人開発しています。\n"
              "APK版公開中。\n\n"
              + DOWNLOAD_URL
              + "\n\n#mtg",

              "Android向けMTG統率者デッキ管理アプリ\n"
              "「統率者ビルダー」公開中です。\n\n"
              "EDHRECの情報も日本語で閲覧できます!。\n\n"
              + DOWNLOAD_URL
              + "\n\n#mtg #統率者",

              "統率者プレイヤー向けにAndroidアプリを作ってみました。\n\n"
              "統率者ビルダー\n"
              "MTG統率デッキの作成・管理用アプリです。\n\n"
              + DOWNLOAD_URL,

              "MTG統率者デッキ管理アプリ「統率者ビルダー」のAPK版を公開しています。\n"
              "EDHRECからのデッキコピーもできます！\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #EDH",

              "MTG 統率者のデッキ管理アプリ「統率者ビルダー」を個人制作しています。\n"
              "日本語テキストでのカード検索もできます！\n"
              "Android版をAPKで配布していますので、興味があればどうぞ。\n\n"
              + DOWNLOAD_URL,

              "統率者デッキを作ったり管理したり検索するためのAndroidアプリを公開しました。\n\n"
              "APKはこちら。\n\n"
              + DOWNLOAD_URL
              + "\n\n#mtg",

              "MTGの統率者 / Commander向けAndroidアプリ「統率者ビルダー」公開!。\n\n"
              "オフラインでのデッキ閲覧もできます!\n\n"
              + DOWNLOAD_URL
              + "\n\n#EDH #mtg",

              "スマホで統率者デッキを管理したい人向けに「統率者ビルダー」を作っています!\n\n"
              "Android APKを公開中です。\n\n"
              + DOWNLOAD_URL,

              "MTG統率者ルール向けアプリ「統率者ビルダー」。\n\n"
              "統率者デッキの作成・カード検索アプリです。\n"
              "APKはこちら。\n\n"
              + DOWNLOAD_URL
              + "\n\n#mtg #統率者",

              "Android用のMTG統率者デッキ管理アプリを公開しています!\n\n"
              "「統率者ビルダー」\n\n"
              "APKはこちらから。\n"
              + DOWNLOAD_URL,

              "MTG Commander / 統率者デッキ管理用アプリ「統率者ビルダー」を公開中!\n\n"
              "現在Android APKを公開しています。\n\n"
              + DOWNLOAD_URL
              + "\n\n#mtg #EDH"

          ]

          # --------------------------------
          # 投稿文を順番にローテーション
          # 4時間ごとに次の文章へ
          # --------------------------------

          index = int(time.time() // (4 * 60 * 60)) % len(posts)
          message = posts[index]

          # README URLを全投稿の最後に自動追加
          message += "\n\nアプリ詳細・導入方法はこちら\n" + README_URL

          print("Selected post:", index + 1, "/", len(posts))

          def graphql(query, variables=None):

              body = json.dumps({
                  "query": query,
                  "variables": variables or {}
              }).encode("utf-8")

              request = urllib.request.Request(
                  API,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {TOKEN}"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if "errors" in result:
                  raise RuntimeError(result["errors"])

              return result["data"]


          # --------------------------------
          # Buffer Organization取得
          # --------------------------------

          org_data = graphql("""
          query GetOrganizations {
            account {
              organizations {
                id
                name
              }
            }
          }
          """)

          organizations = org_data["account"]["organizations"]

          if not organizations:
              raise RuntimeError(
                  "Buffer organizationが見つかりません"
              )

          org_id = organizations[0]["id"]

          print(
              "Buffer organization:",
              organizations[0]["name"]
          )


          # --------------------------------
          # Bufferに接続されているXを取得
          # --------------------------------

          channel_data = graphql("""
          query GetChannels($orgId: OrganizationId!) {
            channels(input: { organizationId: $orgId }) {
              id
              name
              service
            }
          }
          """, {
              "orgId": org_id
          })


          twitter_channels = [
              channel
              for channel in channel_data["channels"]
              if channel["service"] == "twitter"
          ]


          if not twitter_channels:
              raise RuntimeError(
                  "Bufferに接続されたXアカウントが見つかりません"
              )


          channel = twitter_channels[0]

          print(
              "X account:",
              channel["name"]
          )


          # --------------------------------
          # Xへ即時投稿
          # --------------------------------

          post_data = graphql("""
          mutation CreatePost($input: CreatePostInput!) {
            createPost(input: $input) {

              ... on PostActionSuccess {
                post {
                  id
                  text
                  status
                }
              }

              ... on MutationError {
                message
              }

            }
          }
          """, {

              "input": {
                  "text": message,
                  "channelId": channel["id"],
                  "schedulingType": "automatic",
                  "mode": "shareNow"
              }

          })


          result = post_data["createPost"]


          if "message" in result:
              raise RuntimeError(
                  result["message"]
              )


          print("SUCCESS")
          print(
              "Post ID:",
              result["post"]["id"]
          )

          PY
