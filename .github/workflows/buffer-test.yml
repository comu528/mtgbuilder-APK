name: mtgbuilder X Auto Post

on:
  # 手動実行も可能
  workflow_dispatch:

  # 毎日3:37（日本時間）に翌日分をBufferへ予約
  schedule:
    - cron: "37 3 * * *"
      timezone: "Asia/Tokyo"

jobs:
  schedule-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Schedule tomorrow posts via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request

          from datetime import datetime, date, time, timedelta, timezone
          from zoneinfo import ZoneInfo

          API = "https://api.buffer.com"
          TOKEN = os.environ["BUFFER_API_KEY"]

          DOWNLOAD_URL = "https://github.com/comu528/mtgbuilder-APK/releases/latest/download/mtgbuilder.apk"
          README_URL = "https://github.com/comu528/mtgbuilder-APK"

          JST = ZoneInfo("Asia/Tokyo")

          # --------------------------------
          # 自動投稿する文章
          # --------------------------------

          posts = [

              "MTGの統率者デッキを作成・管理できるAndroidアプリ「統率者ビルダー」を公開しました!\n\n"
              "完全無料で使用できます!\n\n"
              "#MTG #EDH",

              "統率者デッキ管理用Androidアプリ「統率者ビルダー」を作りました!\n\n"
              "APKで公開しています。\n"
              "気になった方はぜひ使ってみてください。\n\n"
              "#MTG #mtg",

              "MTG Commander / EDH向けのAndroidアプリ「統率者ビルダー」公開中です。\n\n"
              "オフラインでも閲覧ができます!\n\n"
              "#EDH #mtg",

              "MTG統率者デッキ管理アプリ「統率者ビルダー」を公開しています。\n\n"
              "Android用APKを無料で公開しています。"
              "#mtg #統率者",

              "統率者デッキをAndroidで管理するためのアプリを作りました。\n\n"
              "アプリ名：統率者ビルダー\n"
              "カード検索や欲しいものリスト追加もできます。\n\n"
              "#統率者 #mtg",

              "MTGのデッキ管理、スマホでやりたい人向け。\n\n"
              "統率者用Androidアプリ「統率者ビルダー」を個人開発しています。\n"
              "APK版公開中。\n\n"
              "#mtg",

              "Android向けMTG統率者デッキ管理アプリ\n"
              "「統率者ビルダー」公開中です。\n\n"
              "EDHRECの情報も日本語で閲覧できます!\n\n"
              "#mtg #統率者",

              "統率者プレイヤー向けにAndroidアプリを作ってみました。\n\n"
              "統率者ビルダー\n"
              "MTG統率者デッキの作成・管理用アプリです。",

              "MTG統率者デッキ管理アプリ「統率者ビルダー」のAPK版を公開しています。\n\n"
              "EDHRECからのデッキコピーもできます！\n\n"
              "#mtg #EDH",

              "MTG 統率者のデッキ管理アプリ「統率者ビルダー」を個人制作しています。\n\n"
              "日本語テキストでのカード検索もできます！\n"
              "Android版をAPKで配布していますので、興味があればどうぞ。",

              "統率者デッキを作ったり管理したり検索するためのAndroidアプリを公開しました。\n\n"
              "#mtg",

              "MTGの統率者 / Commander向けAndroidアプリ「統率者ビルダー」公開中!\n\n"
              "オフラインでのデッキ閲覧もできます!\n\n"
              "#EDH #mtg",

              "スマホで統率者デッキを管理したい人向けに「統率者ビルダー」を作っています!\n\n"
              "Android APKを公開中です。",

              "MTG統率者ルール向けアプリ「統率者ビルダー」。\n\n"
              "統率者デッキの作成・カード検索アプリです。\n\n"
              "#mtg #統率者",

              "Android用のMTG統率者デッキ管理アプリを公開しています!\n\n"
              "「統率者ビルダー」",

              "MTG Commander / 統率者デッキ管理用アプリ「統率者ビルダー」を公開中!\n\n"
              "現在Android APKを公開しています。\n\n"
              "#mtg #EDH"

          ]

          # --------------------------------
          # APK・READMEリンクを全投稿に追加
          # --------------------------------

          posts = [
              f"{post}\n\n"
              f"APKダウンロード\n{DOWNLOAD_URL}\n\n"
              f"アプリ詳細・導入方法はこちら\n{README_URL}"
              for post in posts
          ]


          # --------------------------------
          # Buffer API
          # --------------------------------

          def graphql(query, variables=None):

              body = json.dumps({
                  "query": query,
                  "variables": variables or {}
              }).encode("utf-8")

              request = urllib.request.Request(
                  API,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {TOKEN}"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if "errors" in result:
                  raise RuntimeError(result["errors"])

              return result["data"]


          # --------------------------------
          # Buffer Organization取得
          # --------------------------------

          org_data = graphql("""
          query GetOrganizations {
            account {
              organizations {
                id
                name
              }
            }
          }
          """)

          organizations = org_data["account"]["organizations"]

          if not organizations:
              raise RuntimeError(
                  "Buffer organizationが見つかりません"
              )

          org_id = organizations[0]["id"]

          print(
              "Buffer organization:",
              organizations[0]["name"]
          )


          # --------------------------------
          # Xチャンネル取得
          # --------------------------------

          channel_data = graphql("""
          query GetChannels($orgId: OrganizationId!) {
            channels(input: { organizationId: $orgId }) {
              id
              name
              service
            }
          }
          """, {
              "orgId": org_id
          })

          twitter_channels = [
              channel
              for channel in channel_data["channels"]
              if channel["service"] == "twitter"
          ]

          if not twitter_channels:
              raise RuntimeError(
                  "Bufferに接続されたXアカウントが見つかりません"
              )

          channel = twitter_channels[0]

          print(
              "X account:",
              channel["name"]
          )


          # --------------------------------
          # 翌日の4投稿を予約
          # --------------------------------

          now_jst = datetime.now(JST)
          target_day = now_jst.date() + timedelta(days=1)

          posting_times = [
              time(9, 11),
              time(12, 11),
              time(18, 11),
              time(22, 11)
          ]

          # 2026/8/15を投稿1番目の開始日にする
          start_day = date(2026, 8, 15)

          day_offset = (target_day - start_day).days
          start_index = (day_offset * 4) % len(posts)

          print("Scheduling posts for:", target_day)


          mutation = """
          mutation CreatePost($input: CreatePostInput!) {
            createPost(input: $input) {

              ... on PostActionSuccess {
                post {
                  id
                  text
                  dueAt
                  status
                }
              }

              ... on MutationError {
                message
              }

            }
          }
          """


          for slot, post_time in enumerate(posting_times):

              post_index = (start_index + slot) % len(posts)
              message = posts[post_index]

              # 日本時間 → UTCへ変換
              scheduled_jst = datetime.combine(
                  target_day,
                  post_time,
                  tzinfo=JST
              )

              scheduled_utc = scheduled_jst.astimezone(
                  timezone.utc
              )

              due_at = (
                  scheduled_utc
                  .isoformat(timespec="seconds")
                  .replace("+00:00", "Z")
              )

              print(
                  f"Post {post_index + 1}/{len(posts)} "
                  f"-> {scheduled_jst.isoformat()} "
                  f"({due_at})"
              )

              post_data = graphql(
                  mutation,
                  {
                      "input": {
                          "text": message,
                          "channelId": channel["id"],
                          "schedulingType": "automatic",
                          "mode": "customScheduled",
                          "dueAt": due_at
                      }
                  }
              )

              result = post_data["createPost"]

              if "message" in result:
                  raise RuntimeError(
                      result["message"]
                  )

              print(
                  "Scheduled:",
                  result["post"]["id"],
                  result["post"]["dueAt"]
              )


          print("SUCCESS: 4 posts scheduled.")

          PY
