name: mtgbuilder X Auto Post

on:
  # 手動でも実行できるように残しておく
  workflow_dispatch:

  # 日本時間 9:17 / 13:17 / 17:17 / 21:17 に自動投稿
  schedule:
    - cron: "17 9,13,17,21 * * *"
      timezone: "Asia/Tokyo"

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Post mtgbuilder to X via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request

          API = "https://api.buffer.com"
          TOKEN = os.environ["BUFFER_API_KEY"]

          DOWNLOAD_URL = "https://github.com/comu528/mtgbuilder-APK/releases/latest/download/mtgbuilder.apk"

          # --------------------------------
          # 自動投稿する文章
          # ここは好きに増やしたり変更してOK
          # --------------------------------

          posts = [

              "MTGの統率者デッキを作成・管理できるAndroidアプリ「mtgbuilder」を公開しました。\n\n"
              "APK版を無料配布中です。\n"
              "#MTG #EDH\n\n"
              + DOWNLOAD_URL,

              "統率者デッキ管理用Androidアプリ「mtgbuilder」を作りました。\n\n"
              "現在はAPK版を公開しています。\n"
              "気になった方はぜひ使ってみてください。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #統率者",

              "MTG Commander / EDH向けのAndroidアプリ「mtgbuilder」公開中です。\n\n"
              "スマホで統率者デッキを管理したい方向け。\n\n"
              + DOWNLOAD_URL
              + "\n\n#EDH #MTG",

              "個人制作のMTG統率者デッキ管理アプリ「mtgbuilder」を公開しています。\n\n"
              "Android用APKはこちらからダウンロードできます。\n\n"
              + DOWNLOAD_URL,

              "統率者デッキをAndroidで管理するためのアプリを作りました。\n\n"
              "アプリ名：mtgbuilder\n"
              "現在APK版を無料公開中です。\n\n"
              + DOWNLOAD_URL
              + "\n\n#統率者 #MTG",

              "MTGのデッキ管理、スマホでやりたい人向け。\n\n"
              "統率者用Androidアプリ「mtgbuilder」を個人開発しています。\n"
              "APK版公開中。\n\n"
              + DOWNLOAD_URL
              + "\n\n#EDH",

              "Android向けMTG統率者デッキ管理アプリ\n"
              "「mtgbuilder」公開中です。\n\n"
              "まだ開発中ですが、APKからインストールできます。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #Commander",

              "統率者プレイヤー向けにAndroidアプリを作ってみました。\n\n"
              "mtgbuilder\n"
              "MTG Commanderデッキの作成・管理用アプリです。\n\n"
              + DOWNLOAD_URL,

              "Google Play公開に先駆けて、MTG統率者デッキ管理アプリ「mtgbuilder」のAPK版を公開しています。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #EDH",

              "MTG Commanderのデッキ管理アプリ「mtgbuilder」を個人制作しています。\n\n"
              "Android版をAPKで配布していますので、興味があればどうぞ。\n\n"
              + DOWNLOAD_URL,

              "統率者デッキを作ったり管理したりするためのAndroidアプリを公開しました。\n\n"
              "mtgbuilder APK版はこちら。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG",

              "MTGの統率者 / Commander向けAndroidアプリ「mtgbuilder」公開中。\n\n"
              "個人制作の非公式アプリです。\n\n"
              + DOWNLOAD_URL
              + "\n\n#EDH #Commander",

              "スマホで統率者デッキを管理したい人向けに「mtgbuilder」を作っています。\n\n"
              "Android APK版を公開中です。\n\n"
              + DOWNLOAD_URL,

              "MTGプレイヤー向け個人制作アプリ「mtgbuilder」。\n\n"
              "統率者デッキの作成・管理用Androidアプリです。\n"
              "APKはこちら。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #統率者",

              "Android用のMTG統率者デッキ管理アプリを公開しています。\n\n"
              "mtgbuilder\n\n"
              "無料APK版はこちらから。\n"
              + DOWNLOAD_URL,

              "MTG Commander / 統率者デッキ管理用アプリ「mtgbuilder」を制作中。\n\n"
              "現在Android APK版を公開しています。\n\n"
              + DOWNLOAD_URL
              + "\n\n#MTG #EDH"

          ]

          # --------------------------------
          # 投稿文を順番にローテーション
          # 4時間ごとに次の文章へ
          # --------------------------------

          index = int(time.time() // (4 * 60 * 60)) % len(posts)
          message = posts[index]

          print("Selected post:", index + 1, "/", len(posts))

          def graphql(query, variables=None):

              body = json.dumps({
                  "query": query,
                  "variables": variables or {}
              }).encode("utf-8")

              request = urllib.request.Request(
                  API,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {TOKEN}"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if "errors" in result:
                  raise RuntimeError(result["errors"])

              return result["data"]


          # --------------------------------
          # Buffer Organization取得
          # --------------------------------

          org_data = graphql("""
          query GetOrganizations {
            account {
              organizations {
                id
                name
              }
            }
          }
          """)

          organizations = org_data["account"]["organizations"]

          if not organizations:
              raise RuntimeError(
                  "Buffer organizationが見つかりません"
              )

          org_id = organizations[0]["id"]

          print(
              "Buffer organization:",
              organizations[0]["name"]
          )


          # --------------------------------
          # Bufferに接続されているXを取得
          # --------------------------------

          channel_data = graphql("""
          query GetChannels($orgId: OrganizationId!) {
            channels(input: { organizationId: $orgId }) {
              id
              name
              service
            }
          }
          """, {
              "orgId": org_id
          })


          twitter_channels = [
              channel
              for channel in channel_data["channels"]
              if channel["service"] == "twitter"
          ]


          if not twitter_channels:
              raise RuntimeError(
                  "Bufferに接続されたXアカウントが見つかりません"
              )


          channel = twitter_channels[0]

          print(
              "X account:",
              channel["name"]
          )


          # --------------------------------
          # Xへ即時投稿
          # --------------------------------

          post_data = graphql("""
          mutation CreatePost($input: CreatePostInput!) {
            createPost(input: $input) {

              ... on PostActionSuccess {
                post {
                  id
                  text
                  status
                }
              }

              ... on MutationError {
                message
              }

            }
          }
          """, {

              "input": {
                  "text": message,
                  "channelId": channel["id"],
                  "schedulingType": "automatic",
                  "mode": "shareNow"
              }

          })


          result = post_data["createPost"]


          if "message" in result:
              raise RuntimeError(
                  result["message"]
              )


          print("SUCCESS")
          print(
              "Post ID:",
              result["post"]["id"]
          )

          PY
